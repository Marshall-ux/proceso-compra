services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./server:/app
      - sqlite_data:/app/data
      - ./server/uploads:/app/uploads
      - ./server/generated:/app/generated
    environment:
      - FLASK_ENV=development
      - DATABASE_PATH=/app/data/app.db
      # Clave de administración (blanquear/generar códigos/desbloquear PINs).
      # El valor real va en el archivo .env (no se sube a git). Ver .env.example.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cambiar-esta-clave}
    networks:
      - default
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8092:80"
    depends_on:
      - backend
    networks:
      - default
      - portal
volumes:
  sqlite_data:
networks:
  default:
  portal:
    external: true
    name: portal-interno_portal-net
