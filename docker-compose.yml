services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Vuelve solo si se reinicia el servidor o se cae el proceso. (En producción lo
    # hacía un docker-compose.override.yml sin versionar; ya no hace falta.)
    restart: unless-stopped
    # Estado en `docker ps` (healthy / unhealthy): cada 30 s consulta /api/health, que
    # además lee la base. Tres fallas seguidas lo marcan unhealthy. Docker no lo reinicia
    # por eso: es para verlo de un vistazo. Con Python porque la imagen slim no trae curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # El código va dentro de la imagen, no montado: corre exactamente lo que se
    # construyó. Solo se montan los datos, que tienen que sobrevivir a cada build.
    volumes:
      - sqlite_data:/app/data
      - ./server/uploads:/app/uploads
    environment:
      - DATABASE_PATH=/app/data/app.db
      # Clave de administración (blanquear/generar códigos/desbloquear PINs).
      # El valor real va en el archivo .env (no se sube a git). Ver .env.example.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-cambiar-esta-clave}
      # Clave para tildar Autopack (solo administración). Sin definir, es 12345.
      - AUTOPACK_PASSWORD=${AUTOPACK_PASSWORD:-12345}
      # Avisos por mail (ver README). Van SIN "=": así, si la variable no está en
      # el .env, manda el default del código y no una cadena vacía que lo pise.
      - APP_NOMBRE
      - APP_COLOR
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
      - MAIL_FROM_NOMBRE
      - MAIL_REPLY_TO
      # Dominio con el que se arman los links de los mails. Sin esto el link sale
      # apuntando a http://backend:5000, que no existe fuera de la red de Docker.
      - PUBLIC_BASE_URL
      # Recordatorios al firmante (48 h y una semana después). 0 los apaga.
      - RECORDATORIOS
      # Destinatarios: cajeras por ubicación y razón social (y por razón social sola,
      # para las solicitudes sin ubicación). El mail de cada autorizante está en la
      # base: se carga desde el panel.
      - CAJA_ROSARIO_ALCO_ROSARIO
      - CAJA_SANTA_FE_ALCO_ROSARIO
      - CAJA_ROSARIO_NEOSTAR
      - CAJA_SANTA_FE_NEOSTAR
      - CAJA_ROSARIO_HIKARI
      - CAJA_SANTA_FE_HIKARI
      - CAJA_ALCO_ROSARIO
      - CAJA_NEOSTAR
      - CAJA_XINOXIA
      - CAJA_DASEOS
      - CAJA_HIKARI
    networks:
      - default
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "8092:80"
    depends_on:
      - backend
    networks:
      - default
      - portal
volumes:
  sqlite_data:
networks:
  default:
  portal:
    external: true
    name: portal-interno_portal-net
