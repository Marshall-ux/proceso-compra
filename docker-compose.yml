services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./server:/app
      - sqlite_data:/app/data
      - ./server/uploads:/app/uploads
      - ./server/generated:/app/generated
    environment:
      - FLASK_ENV=development
      - DATABASE_PATH=/app/data/app.db
      # Clave de administración para blanquear/generar códigos/desbloquear PINs.
      # CAMBIAR por una propia antes de usar en serio.
      - ADMIN_PASSWORD=neostar-2026
    networks:
      - default
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8092:80"
    depends_on:
      - backend
    networks:
      - default
      - portal
volumes:
  sqlite_data:
networks:
  default:
  portal:
    external: true
    name: portal-interno_portal-net
